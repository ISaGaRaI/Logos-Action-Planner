<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eureka Logos Planner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #1a1a1a; color: #e8e8e8;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; margin-bottom: 14px; }
  .toolbar button {
    background: #2a2a2a; color: #ddd; border: 1px solid #444;
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px;
  }
  .toolbar button:hover { background: #3a3a3a; }
  .toolbar button.primary { background: #2c5f63; border-color: #3d8484; }
  .toolbar button.primary:hover { background: #357070; }
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: nowrap; }
  
  .toolbar button.icon-btn { padding: 3px; display: flex; align-items: center; }
  .toolbar button.icon-btn img { width: 22px; height: 22px; object-fit: contain; }
  .toolbar button.active { background: #357070; border-color: #7fd4d4; box-shadow: 0 0 8px rgba(127,212,212,.5); }

  .skill-panel { background-color: #272627; border: 1px solid #141414; border-radius: 10px; padding: 10px; }
  .skill-panel h2 { font-size: 14px; color: #bbb; margin: 2px 2px 10px 2px; font-weight: 600; }
  .skill-grid { display: grid; grid-template-columns: repeat(10, 48px); grid-auto-rows: 48px; gap: 6px; }
  .skill {
    background: #1d1d1d; border: 1px solid #3a3a3a; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative;
    transition: border-color .15s, transform .1s; padding: 2px;
  }
  .skill:hover { border-color: #7fd4d4; transform: translateY(-2px); }
  .skill img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .skill .fallback {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
    font-size: 13px; font-weight: 700; border-radius: 5px; color: #fff; pointer-events: none;
  }
  .skill.has-img .fallback { display: none; }
  .skill.used { border-color: #7fa86a; }
  .skill.used::after {
    content: attr(data-count); position: absolute; top: -6px; right: -6px;
    background: #4a6b35; color: #eaf5df; font-size: 10px; font-weight: 700;
    min-width: 15px; height: 15px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
    border: 1px solid #6b8f52;
  }
  .skill.logo-hit { border-color: #ffe9a8; box-shadow: 0 0 10px rgba(255,233,168,.85); transform: translateY(-2px); }
  .empty-slot { background: transparent; border: 1px dashed #333; border-radius: 6px; }

  .bar-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar-wrapper { display: flex; flex-direction: row; align-items: flex-start; gap: 10px; }
  .bar-controls-vertical { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bar-controls-vertical button {
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
    width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s;
  }
  .bar-controls-vertical button:hover { background: #454545; border-color: #7fd4d4; }
  .bar-controls-vertical button:disabled { opacity: .3; cursor: default; background: #262626; border-color: #3a3a3a; }
  .bar-controls-vertical button.clear-btn { background: #432c2c; border-color: #7a4a4a; color: #f0d9d9; }
  .bar-controls-vertical button.clear-btn:hover { background: #5a3838; }
  .slot-count { font-size: 11px; color: #888; text-align: center; letter-spacing: .3px; }

  .logos-bar {
    width: 216px; padding: 3px;
    background: linear-gradient(180deg, #3d8484 0%, #2c5f63 60%, #27555a 100%);
    border: 5px solid #6e5233; outline: 1px solid #3f2f1d; border-radius: 10px;
    box-shadow: 0 0 0 3px rgba(110,82,51,.35), inset 0 0 18px rgba(0,0,0,.35);
    display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
    transition: height .25s ease;
  }
  .bar-row { display: flex; flex-direction: row; justify-content: center; gap: 12px; align-items: center; border-radius: 6px; }
  .bar-row.drop-hover { outline: 1px dashed #b8e4e4; outline-offset: -2px; background: rgba(255,255,255,.05); }
  .bar-divider {
    height: 3px; border-radius: 2px; flex-shrink: 0;
    background: linear-gradient(90deg, rgba(110,82,51,0) 0%, #6e5233 12%, #8a6a3f 50%, #6e5233 88%, rgba(110,82,51,0) 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .bar-skill {
    background: rgba(18, 42, 44, .6); border: 2px solid rgba(110, 82, 51, .95); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 1px;
    position: relative; transition: transform .12s;
  }
  .bar-skill:hover { transform: scale(1.06); }
  .bar-skill img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .bar-skill .fallback {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
    font-size: 12px; font-weight: 700; color: #fff; border-radius: 5px; pointer-events: none;
  }
  .bar-skill .remove-hint {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #ffe9a8; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .bar-skill:hover .remove-hint { opacity: 1; }
  .bar-empty { color: #bfe3e3; font-size: 11px; text-align: center; align-self: center; max-width: 140px; line-height: 1.4; user-select: none; }
  .bar-full-warning { color: #ff9b9b; font-size: 12px; min-height: 16px; text-align: center; }

  .bottom-row { position: relative; margin-top: 10px; width: 100%; }
  .main-area { display: flex; flex-direction: column; align-items: flex-start; }
  .selected-panel { width: 100%; background-color: #272627; border: 1px solid #141414; border-radius: 10px; padding: 14px 16px; }
  .selected-panel h2 { font-size: 15px; color: #bbb; margin-bottom: 10px; font-weight: 600; }
  .selected-list { display: flex; flex-direction: column; gap: 6px; }
  .sel-item { background: #1d1d1d; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .sel-item summary {
    cursor: pointer; padding: 8px 12px; font-size: 14px;
    display: flex; align-items: center; gap: 10px; list-style: none; user-select: none;
  }
  .sel-item summary::-webkit-details-marker { display: none; }
  .sel-item summary::before { content: "\25B8"; color: #7fd4d4; transition: transform .15s; }
  .sel-item[open] summary::before { transform: rotate(90deg); }
  .sel-item summary:hover { background: #232323; }
  .sel-item .icon-preview { width: 26px; height: 26px; object-fit: contain; border-radius: 4px; background: #151515; padding: 1px; }
  .sel-count { background: #4a6b35; color: #eaf5df; border: 1px solid #6b8f52; font-size: 10.5px; font-weight: 700; border-radius: 8px; padding: 1px 7px; margin-left: 2px; flex-shrink: 0; }
  .sel-count.one { visibility: hidden; }
  .sel-body { padding: 4px 14px 12px 34px; color: #ccc; font-size: 13px; line-height: 1.7; }
  .sel-body .section-label { display: block; font-weight: 700; font-size: 11.5px; letter-spacing: 1px; margin: 8px 0 2px 0; }
  .sel-body .lbl-desc { color: #7fd4d4; }
  .sel-body .lbl-role { color: #e0b060; }
  .sel-body .lbl-combo { color: #a8c86a; }
  .sel-body .skill-desc { color: #ddd; font-size: 13px; line-height: 1.65; border-left: 3px solid #3d8484; padding-left: 10px; }
  .sel-body .role-groups { display: flex; flex-direction: row; flex-wrap: wrap; gap: 14px; border-left: 3px solid #8a6a3f; padding-left: 10px; margin-top: 2px; }
  .role-group { display: flex; flex-direction: column; gap: 3px; min-width: 100px; }
  .role-group-header {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #c9a55f;
    border-bottom: 1px solid #4a3a22; padding-bottom: 2px; margin-bottom: 2px; text-transform: uppercase;
  }
  .sel-body .recipe-line { display: list-item; list-style: disc; margin-left: 16px; }
  .sel-body .combo-num { color: #a8c86a; margin-right: 4px; }
  .sel-body .no-data { color: #777; font-style: italic; }
  .selected-empty { color: #777; font-size: 13px; font-style: italic; }
  .footer-note { margin-top: 22px; color: #777; font-size: 12px; text-align: center; max-width: 820px; line-height: 1.5; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #2c5f63; color: #dff5f5; border: 1px solid #3d8484;
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  #tooltip {
    position: fixed; z-index: 999; background: #10201f; color: #e8f4f4;
    border: 1px solid #3d8484; border-radius: 8px; padding: 8px 12px;
    font-size: 12.5px; line-height: 1.55; max-width: 500px;
    pointer-events: none; opacity: 0; transition: opacity .1s; box-shadow: 0 4px 14px rgba(0,0,0,.55);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tip-main { display: flex; flex-direction: row; gap: 10px; align-items: flex-start; }
  #tooltip .tip-text { flex: 1; min-width: 0; }
  #tooltip .tip-text b { display: block; color: #bfe3e3; margin-bottom: 3px; font-size: 13px; }
  #tooltip .tip-nodesc { display: block; color: #6e8a8a; font-style: italic; font-size: 11.5px; }
  #tooltip .tip-desc { display: block; max-width: 500px; }
  #tooltip .tip-sep { display: block; height: 1px; background: #2a4a48; margin: 5px 0; }
  #tooltip .tip-roles { display: flex; flex-direction: row; gap: 1px; align-items: flex-start; margin-top: 1px; }
  #tooltip .tip-role-row { display: flex; flex-direction: column; gap: 3px; }
  #tooltip .tip-jobs { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
  #tooltip .tip-job {
    display: flex; align-items: center; justify-content: center;
    background: rgba(46,42,32,.5); border-radius: 6px;
    padding: 1px; width: fit-content;
  }
  .logo-panel { background:#272627; border:1px solid #141414; border-radius:10px; padding:10px; overflow-y:auto; width:230px; flex-shrink:0; }
  .logo-panel h2 { font-size:14px; color:#bbb; margin:2px 2px 10px 2px; font-weight:600; }
  .logo-item { background:#1d1d1d; border:1px solid #333; border-radius:8px; margin-bottom:6px; overflow:hidden; }
  .logo-item summary { cursor:pointer; padding:6px 10px; font-size:13px; display:flex; align-items:center; gap:8px; list-style:none; user-select:none; }
  .logo-item summary::-webkit-details-marker { display:none; }
  .logo-item summary::before { content:"\25B8"; color:#7fd4d4; transition:transform .15s; }
  .logo-item[open] summary::before { transform:rotate(90deg); }
  .logo-item summary:hover { background:#232323; }
  .logo-item .logo-icon { width:24px; height:24px; object-fit:contain; border-radius:4px; background:#151515; padding:1px; }
  .logo-items { padding:2px 10px 10px 24px; display:flex; flex-wrap:wrap; gap:6px; }
  .logo-chip { display:flex; align-items:center; gap:4px; background:rgba(46,42,32,.5); border:1px solid #3a3a3a; border-radius:6px; padding:2px 6px 2px 2px; font-size:11.5px; color:#ccc; }
  .logo-chip img { width:18px; height:18px; object-fit:contain; }
  .logo-chip.chip-active { border-color: #ffe9a8; background: rgba(255,233,168,.18); }
  .sel-body .recipe-line { cursor:pointer; border-radius:6px; padding:1px 6px; }
  .sel-body .recipe-line:hover { background:#232323; }
  .sel-body .recipe-line.picked { background:rgba(61,132,132,.25); outline:1px solid #3d8484; }
  .splitter-panel { display:none; background:#272627; border:1px solid #3d8484; border-radius:10px; padding:10px 12px; width:230px; }
  .splitter-panel.show { display:block; }
  .splitter-panel h3 { font-size:12px; color:#7fd4d4; letter-spacing:1px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; text-transform:uppercase; }
  .splitter-panel h3 button { background:none; border:none; color:#ff9b9b; cursor:pointer; font-size:14px; }
  .splitter-row { display:flex; align-items:center; gap:6px; font-size:12px; color:#ccc; padding:2px 0; }
  .splitter-row img { width:20px; height:20px; object-fit:contain; }
  .splitter-row .n { margin-left:auto; color:#ffe9a8; font-weight:700; }
  .combo-summary { display: none; position: absolute; left: calc(100% + 14px); top: 0; width: 340px;
    background: #272627; border: 1px solid #141414; border-radius: 10px; padding: 12px 14px; }
  .combo-summary .cs-pieces { flex-direction: column; align-items: flex-start; gap: 3px; }
  .combo-summary .plus { display: none; }
  .combo-summary.show { display: block; }
  .combo-summary h3 { font-size: 14px; color: #bbb; font-weight: 600; margin-bottom: 8px; }
  .combo-skill { background: #1d1d1d; border: 1px solid #333; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
  .combo-skill .cs-head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #bfe3e3; margin-bottom: 4px; }
  .combo-skill .cs-head img { width: 20px; height: 20px; object-fit: contain; }
  .combo-skill .cs-pieces { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11.5px; color: #ccc; }
  .combo-skill .cs-pieces img { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; }
  .combo-skill .plus { color: #a8c86a; margin: 0 2px; }
  .sel-actions { margin-left: auto; display: flex; gap: 4px; }
  .sel-btn { background: #2a2a2a; border: 1px solid #555; color: #ddd; border-radius: 6px; cursor: pointer;
    font-size: 13px; line-height: 1; padding: 2px 7px; }
  .sel-btn:hover { background: #454545; border-color: #7fd4d4; }
  .sel-btn.rm { border-color: #7a4a4a; color: #f0d9d9; }
  .bars-outer { display:flex; gap:10px; align-items:flex-start; }
  .bars-wrap { display:flex; gap:10px; align-items:flex-start; }
  .bar-col { display:flex; flex-direction:column; align-items:center; position:relative; }
  .bar-col .logos-bar { margin-top:6px; }
  .bar-head { display:none; position:absolute; top:-22px; left:42px; width:216px; height:18px;
    line-height:18px; font-size:11px; letter-spacing:1.2px; color:#c9a55f;
    text-transform:uppercase; font-weight:700; text-align:left; white-space:nowrap;
    z-index:6; pointer-events:none; }
  .bar-head.on { display:block; }
  #bar2Block .bar-head { left:0; }
  .bar-aside { display:flex; gap:10px; align-items:flex-start; }
  #bar2Block { display:none; }
  #bar2Block.show { display:flex; }
  .pct-q { color:#aaa; border-color:#666; }
  .pct-100 { color:#d3f0b8; background:#3f6b2f; border-color:#7fa86a; }
  .pct-70 { color:#f2ecc0; background:#6b6230; border-color:#c9bb60; }
  .pct-50 { color:#ffd9ae; background:#6b4d24; border-color:#cf9050; }
  .pct-30 { color:#ffc4c4; background:#6b3030; border-color:#cc7070; }
  #comboPop { position:fixed; z-index:1000; background:#10201f; border:1px solid #3d8484;
    border-radius:8px; padding:8px; display:none; max-width:320px; box-shadow:0 4px 14px rgba(0,0,0,.55); }
  #comboPop.show { display:block; }
  #comboPop h4 { font-size:12px; color:#bfe3e3; margin:0 0 6px 2px; }
  #comboPop .pop-line { display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:12px;
    color:#ccc; padding:4px 6px; border-radius:6px; cursor:pointer; }
  #comboPop .pop-line:hover { background:rgba(127,212,212,.15); }
  #comboPop .pop-line.pop-picked { outline:1px solid #3d8484; background:rgba(61,132,132,.25); }
  #comboPop .pop-line img { width:16px; height:16px; object-fit:contain; }
  #comboPop .pop-x { float:right; background:none; border:none; color:#ff9b9b; cursor:pointer; font-size:13px; padding:0 2px; }
  #comboPop .pop-skill-head { display:flex; align-items:center; gap:6px; font-size:12px;
    color:#ffe9a8; font-weight:700; margin:6px 2px 2px 2px; }
  #comboPop .pop-skill-head img { width:18px; height:18px; object-fit:contain; }
  #comboPop .pop-sep { height:1px; background:#2a4a48; margin:7px 2px; }
  .bar-flex { display:flex; gap:4px; align-items:flex-start; }
  .pct-col { width:38px; display:flex; flex-direction:column; gap:4px; padding:8px 0; flex-shrink:0; }
  .pct-cell { display:flex; align-items:center; justify-content:center; font-size:10.5px;
    font-weight:700; border:1px solid; border-radius:6px; background:#1d1d1d; cursor:pointer; user-select:none; }
  .pct-cell.pct-q { color:#aaa; border-color:#555; }
  .pct-cell.pct-100 { color:#d3f0b8; border-color:#7fa86a; }
  .pct-cell.pct-70 { color:#f2ecc0; border-color:#c9bb60; }
  .pct-cell.pct-50 { color:#ffd9ae; border-color:#cf9050; }
  .pct-cell.pct-30 { color:#ffc4c4; border-color:#cc7070; }
  .pct-spacer { height:3px; flex-shrink:0; }
  .cs-src { display:inline-flex; align-items:center; gap:2px; margin-left:4px; vertical-align:-2px; opacity:.85; }
  .cs-src img { width:13px; height:13px; object-fit:contain; }
</style>
</head>
<body>

<h1>&#9876; EUREKA LOGOS PLANNER</h1>
<link rel="icon" type="image/png" href="divers/BAprepare.png">
<div class="subtitle" id="subtitle"></div>

<div class="main-area">
<div class="toolbar">
  <button id="btnLang" title="Language / Sprache">&#127760;</button>
  <button id="btnExportPng" class="primary"></button>
  <button id="btnSplitters" title="Splitter ein-/ausblenden" class="icon-btn"><img src="divers/logo.png" alt="Splitter"></button>
  <button id="btnBar2" title="BA Prepare" class="icon-btn"><img src="divers/BAprepare.png" alt="BA Prepare"></button>
</div>
<div class="layout">
  <div class="logo-panel">
    <h2 id="logoTitle"></h2>
    <div id="logoList"></div>
  </div>
  <div class="skill-panel" id="skillPanel">
    <h2 id="panelTitle"></h2>
    <div class="skill-grid" id="skillGrid"></div>
  </div>
  <div class="bar-section">                      <!-- Ö 1 -->
    <div class="bars-outer">                     <!-- Ö 2 -->
      <div class="bars-wrap">                    <!-- Ö 3 -->
        <div class="bar-col">
          <div class="bar-head" id="barHead1"></div>
          <div class="bar-flex">
            <div class="pct-col" id="pctCol1"></div>
            <div class="logos-bar" id="logosBar"></div>
          </div>
        </div>                                  <!-- Zu 4 -->
        <div class="bar-col" id="bar2Block">
          <div class="bar-head" id="barHead2"></div>
          <div class="bar-flex">
            <div class="logos-bar" id="logosBar2"></div>
            <div class="pct-col" id="pctCol2"></div>
          </div>
        </div>                                 <!-- Zu 4 -->
      </div>                                     <!-- Zu 3: bars-wrap ENDE -->
      <div class="bar-aside">                    <!-- Ö 3 -->
        <div class="splitter-panel" id="splitterPanel"></div>
        <div class="bar-controls-vertical">
          <button id="slotPlus" title="Mehr Reihen / More rows">+</button>
          <button id="slotMinus" title="Weniger Reihen / Fewer rows">&minus;</button>
          <button id="resetBtn" class="clear-btn" title="Leeren / Clear">&times;</button>
        </div>
      </div>                                     <!-- Zu 3: bar-aside ENDE -->
    </div>                                       <!-- Zu 2: bars-outer ENDE -->
    <div class="slot-count" id="slotLabel"></div>
    <div class="bar-full-warning" id="warning"></div>
  </div>   <!-- Zu 1: bar-section ENDE -->
  </div>                                         <!-- .layout ENDE -->

<div class="bottom-row" id="bottomRow">
  <div class="selected-panel">
    <h2 id="selTitle"></h2>
    <div class="selected-list" id="selectedList"></div>
  </div>
  <div class="combo-summary" id="comboSummary"></div>
</div>
</div>

<div class="footer-note" id="footerNote"></div>
<div id="comboPop"></div>
<div id="toast"></div>
<div id="tooltip"></div>

<!-- LADE ZUERST DIE DATEN -->
<script src="data.js"></script>

<script>
  const ACTIONS_DIR = "logos_icons";
  const FRAGMENTS_DIR = "logos_fragment_icons";
  const CLASS_ROLE_DIR = "class_role";

  let LANG = (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";

  const ROLES = [];
  (function parseRoles() {
    for (const line of ROLE_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 2 || !parts[0]) continue;
      ROLES.push({ file: parts[0], nameEn: parts[1], nameDe: parts[2] || parts[1] });
    }
  })();
  function roleDisplayName(role) { return LANG === "de" ? role.nameDe : role.nameEn; }

  const CLASSES = {};
  (function parseClasses() {
    for (const line of CLASS_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 2 || !parts[0]) continue;
      CLASSES[parts[1].toLowerCase()] = { file: parts[0], nameDe: parts[2] || parts[1], role: parts[3] || "" };
    }
  })();
  function classEntry(name) { return CLASSES[name.trim().toLowerCase()] || null; }
  function classDisplay(name) {
    const e = classEntry(name);
    if (LANG === "de") return e ? e.nameDe : name.trim();
    return name.trim();
  }
  function classRoleKey(name) {
    const e = classEntry(name);
    return e && e.role ? e.role.trim().toLowerCase() : "";
  }

  function groupClasses(clsList) {
    const expanded = [];
    for (const cls of clsList) {
      const c = cls.trim().toLowerCase();
      const roleMatch = ROLES.find(function(r) {
        return r.nameEn.toLowerCase() === c || r.nameDe.toLowerCase() === c;
      });
      if (roleMatch) {
        const rk = roleMatch.nameEn.toLowerCase();
        for (const key of Object.keys(CLASSES)) {
          const e = CLASSES[key];
          if (e.role && e.role.trim().toLowerCase() === rk) expanded.push(key);
        }
      } else {
        expanded.push(cls);
      }
    }
    const seen = new Set();
    const uniq = expanded.filter(function(x) {
      const k = x.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    const groups = ROLES.map(r => ({ role: r, jobs: [] }));
    const other = [];
    for (const cls of uniq) {
      const key = classRoleKey(cls);
      const g = groups.find(g => g.role.nameEn.toLowerCase() === key);
      if (g) g.jobs.push(cls); else other.push(cls);
    }
    const out = groups.filter(g => g.jobs.length > 0);
    if (other.length > 0) out.push({ role: null, jobs: other });
    return out;
  }

  async function idbSet(k, v) {

    return new Promise(function(res, rej) {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = res;
      tx.onerror = function() { rej(tx.error); };
    });
  }

    return new Promise(function(res, rej) {
      const tx = db.transaction("kv", "readonly");
      const rq = tx.objectStore("kv").get(k);
      rq.onsuccess = function() { res(rq.result); };
      rq.onerror = function() { rej(tx.error); };
    });
  }

    if (!dirHandle) return;
    for (const dirName of [ACTIONS_DIR, FRAGMENTS_DIR, CLASS_ROLE_DIR]) {
      const sub = await getSubDir(dirName);
      if (!sub) continue;
      try {
        for await (const entry of sub.entries()) {
          const name = entry[0], handle = entry[1];
          if (handle.kind === "file") {
            try { iconUrls[name.toLowerCase()] = URL.createObjectURL(await handle.getFile()); }
            catch (e) {}
          }
        }
      } catch (e) {}
    }
  }

      srcArr[fr].splice(fi, 1);

  function rowPctInfo(dataRows, r) {
    let total = 0, unknown = false, hasCombo = false;
    for (const en of dataRows[r]) {
      const skill = skillById(en.id);

      hasCombo = true;
      const ci = effectiveCombo(en, skill);
      if (ci === null || !skill.combos[ci]) { unknown = true; continue; }
      total += mnemeTotal(skill.combos[ci]);
    }
    if (!hasCombo) return null;
    if (unknown) return { cls: "pct-q", text: "?%" };
    const info = pctInfo(total);
    return { cls: info.cls, text: info.pct + "%" };
  }

  const activeMnemes = new Set();
  function refreshMnemeHits() {
    grid.querySelectorAll(".skill.logo-hit").forEach(function(tile) { tile.classList.remove("logo-hit"); });
    if (activeMnemes.size === 0) return;
    grid.querySelectorAll(".skill").forEach(function(tile) {
      const sk = skillById(tile.dataset.id);
      if (!sk) return;
      let hit = false;
      outer: for (const c of sk.combos) {
        for (const piece of parseCombo(c)) {
          if (activeMnemes.has(piece.name.trim().toLowerCase())) { hit = true; break outer; }
        }
      }
      if (hit) tile.classList.add("logo-hit");
    });
  }
  function makeItemChip(name) {
    const chip = document.createElement("span");
    chip.className = "logo-chip";
    const frag = fragmentByName(name);
    if (frag) {
      const im = document.createElement("img");
      im.src = iconUrls[frag.file.toLowerCase()] || (FRAGMENTS_DIR + "/" + frag.file);
      im.alt = frag.nameEn;
      im.onerror = function() { im.remove(); };
      chip.appendChild(im);
    }
    const nm = document.createElement("span");
    nm.textContent = frag ? (LANG === "de" ? frag.nameDe : frag.nameEn) : name;
    chip.appendChild(nm);
    chip.addEventListener("click", function() {
      const key = name.trim().toLowerCase();
      if (activeMnemes.has(key)) { activeMnemes.delete(key); chip.classList.remove("chip-active"); }
      else { activeMnemes.add(key); chip.classList.add("chip-active"); }
      refreshMnemeHits();
    });
    return chip;
  }

  function aggregateSplitters() {
    const totals = {};
    for (const r of rows) for (const en of r) {
      const skill = skillById(en.id);
      if (!skill || skill.combos.length === 0) continue;
      let ci = en.combo;
      if (ci === null && skill.combos.length === 1) ci = 0;
      if (ci === null || !skill.combos[ci]) continue;
      for (const piece of parseCombo(skill.combos[ci])) {
        const key = piece.name.toLowerCase();
        if (!totals[key]) totals[key] = { name: piece.name, count: 0, frag: fragmentByName(piece.name) };
        totals[key].count += piece.count;
      }
    }
    return Object.values(totals);
  }

    }
    const h = document.createElement("h3");
    h.textContent = t("splTitle");
    const x = document.createElement("button");
    x.textContent = "\u2715";
    x.title = "Ausblenden";
    x.addEventListener("click", function() { splitterPanelVisible = false; renderSplitterPanel(); });
    h.appendChild(x);
    panel.appendChild(h);
    items.forEach(function(it) {
      const row = document.createElement("div");
      row.className = "splitter-row";
      if (it.frag) {
        const im = document.createElement("img");
        im.src = iconUrls[it.frag.file.toLowerCase()] || (FRAGMENTS_DIR + "/" + it.frag.file);
        im.alt = it.frag.nameEn;
        im.onerror = function() { im.remove(); };
        row.appendChild(im);
        const nm = document.createElement("span");
        nm.textContent = LANG === "de" ? it.frag.nameDe : it.frag.nameEn;
        row.appendChild(nm);
      } else {
        row.textContent = it.name;
      }
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = t("times")(it.count);
      row.appendChild(n);
      panel.appendChild(row);
    });
  }
  
    function logogramsContaining(itemName) {
    const key = (itemName || "").trim().toLowerCase();
    if (!key) return [];
    return LOGOGRAMS.filter(function(l) {
      return l.items.some(function(it) { return it.trim().toLowerCase() === key; });
    });
  }
  
  function renderComboSummary() {
    const host = document.getElementById("comboSummary");
    if (!host) return;
    host.innerHTML = "";
    const done = new Set();
    let any = false;
    for (const id of selected) {
      const skill = skillById(id);
      if (!skill || skill.combos.length === 0 || done.has(id)) continue;
      done.add(id);
      let picked = pickedCombos[skill.id];
      if (picked === undefined && skill.combos.length === 1) picked = 0;
      if (picked === undefined || !skill.combos[picked]) continue;
      any = true;
      const box = document.createElement("div");
      box.className = "combo-skill";
      const head = document.createElement("div");
      head.className = "cs-head";
      const im = makeImg(skill);
      im.style.cssText = "width:20px;height:20px;object-fit:contain;";
      head.appendChild(im);
      const nm = document.createElement("span");
      nm.textContent = displayName(skill);
      head.appendChild(nm);
      box.appendChild(head);
      const pieces = document.createElement("div");
      pieces.className = "cs-pieces";
      parseCombo(skill.combos[picked]).forEach(function(piece, pi) {
        const li = document.createElement("div");
        li.className = "cs-piece";
        li.style.cssText = "display:flex;align-items:center;gap:4px;flex-wrap:wrap;";
        const frag = fragmentByName(piece.name);
        if (frag) {
          const fi = document.createElement("img");
          fi.src = iconUrls[frag.file.toLowerCase()] || (FRAGMENTS_DIR + "/" + frag.file);
          fi.alt = frag.nameEn;
          li.appendChild(fi);
        }
        const pn = document.createElement("span");
        pn.textContent = " " + (frag ? (LANG === "de" ? frag.nameDe : frag.nameEn) : piece.name);
        if (piece.count > 1) pn.textContent += " " + t("times")(piece.count);
        li.appendChild(pn);
        const lgSrcs = logogramsContaining(piece.name);
        if (lgSrcs.length > 0) {
          const src = document.createElement("span");
          src.className = "cs-src";
          src.title = lgSrcs.map(logoName).join(", ");
          lgSrcs.forEach(function(lg) {
            const im = document.createElement("img");
            im.src = iconUrls[lg.file.toLowerCase()] || (FRAGMENTS_DIR + "/" + lg.file);
            im.alt = logoName(lg);
            im.onerror = function() { im.remove(); };
            src.appendChild(im);
          });
          li.appendChild(src);
        }
        pieces.appendChild(li);
      });
      box.appendChild(pieces);
      host.appendChild(box);
    }
    host.classList.toggle("show", any);
  }
  function syncPanels() {
    const lp = document.querySelector(".logo-panel");
    if (lp && panel.offsetHeight > 0) lp.style.maxHeight = panel.offsetHeight + "px";
    const layout = document.querySelector(".layout");
    const row = document.getElementById("bottomRow");
    if (layout && row && panel.offsetWidth > 0) {
      row.style.width = (panel.getBoundingClientRect().right - layout.getBoundingClientRect().left) + "px";
    }
  }
  
  function refreshAll() {
    renderBar();
    renderSelectedList();
    updateTileMarkers();
    updateSlotLabel();
    renderSplitterPanel();
    saveState();
	renderComboSummary();
	syncPanels();
  }

  function updateSlotLabel() {
    label.textContent = t("rows")(rowCount, capacity());
    btnMinus.disabled = (rowCount <= MIN_ROWS);
    btnPlus.disabled = (rowCount >= MAX_ROWS);
  }

  function mapBarEntries(src) {
    const out = [];
    for (const it of src) {
      if (typeof it === "string" && skillById(it)) out.push({ uid: ++uidSeq, id: it, combo: null });
      else if (it && skillById(it.id)) out.push({ uid: ++uidSeq, id: it.id, combo: (typeof it.combo === "number" ? it.combo : null) });
    }
    return out;
  }

  function stateObj() {
    return { app: "eureka-logos-planner", rows: rows, rows2: rows2, selected: selected.slice(), combos: pickedCombos };
  }

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stateObj())); } catch (e) {}
  }

  function chunkPairs(arr, n) {
    const out = [];
    let i = 0;
    while (out.length < n) { out.push(arr.slice(i, i + PER_ROW)); i += PER_ROW; }
    return out;
  }

  function applyState(st) {
    let newRows = null;
    if (st && Array.isArray(st.rows)) newRows = st.rows;
    else if (st && Array.isArray(st.skills)) newRows = chunkPairs(st.skills, st.rows || 3);
    if (!newRows) return false;
    rowCount = Math.max(MIN_ROWS, Math.min(MAX_ROWS, newRows.length || MIN_ROWS));
    pickedCombos = (st && st.combos && typeof st.combos === "object") ? st.combos : {};
    if (st && Array.isArray(st.selected)) {
      selected = st.selected.filter(function(id) { return !!skillById(id); });
    } else {
      const seenS = new Set();
      for (const r of newRows) for (const it of r) seenS.add(typeof it === "string" ? it : it.id);
      selected = Array.from(seenS);
    }
    rows = [];
    uidSeq = 0;
    for (let r = 0; r < rowCount; r++) rows.push(mapBarEntries(newRows[r] || []).slice(0, PER_ROW));
    if (st && Array.isArray(st.rows2)) {
      rows2 = [];
      for (let r = 0; r < rowCount; r++) rows2.push(mapBarEntries(st.rows2[r] || []).slice(0, PER_ROW));
    } else rows2 = null;
    computeRowHeight();
    refreshAll();
    return true;
  }

  function loadState() {
    try {
      let raw = localStorage.getItem(STORE_KEY);
      if (!raw) raw = localStorage.getItem(OLD_STORE_KEY);
      if (!raw) return;
      applyState(JSON.parse(raw));
    } catch (e) {}
  }

  function waitForImages() {
    const imgs = Array.prototype.slice.call(document.querySelectorAll("img[data-file]"));
    return Promise.all(imgs.map(function(im) {
      return im.complete ? Promise.resolve() : new Promise(function(res) { im.onload = res; im.onerror = res; });
    }));
  }

  async function connectFolderForExport() {
    if (!window.showDirectoryPicker) return false;
    try {
      if (dirHandle && (await dirHandle.queryPermission({ mode: "read" })) === "granted") return true;
      showToast(t("pngAskFolder"));
      dirHandle = await window.showDirectoryPicker({ mode: "read" });
      try { await idbSet("projectDir", dirHandle); } catch (e) {}
      await scanIcons();
      refreshImages();
      await waitForImages();
      return true;
    } catch (e) { return false; }
  }

  async function exportPng(isRetry) {
    if (isRetry === undefined) isRetry = false;
    const SCALE = 2;
    const bw = bar.offsetWidth, bh = bar.offsetHeight;
    const canvas = document.createElement("canvas");
    canvas.width = bw * SCALE; canvas.height = bh * SCALE;
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    const grad = ctx.createLinearGradient(0, 0, 0, bh);
    grad.addColorStop(0, "#3d8484"); grad.addColorStop(0.6, "#2c5f63"); grad.addColorStop(1, "#27555a");
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, bw, bh, 10); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = "#6e5233";
    roundRect(ctx, 2.5, 2.5, bw - 5, bh - 5, 8); ctx.stroke();
    const barRect = bar.getBoundingClientRect();
    for (const el of bar.querySelectorAll(".bar-skill, .bar-divider")) {
      const r = el.getBoundingClientRect();
      const x = r.left - barRect.left, y = r.top - barRect.top;
      if (el.classList.contains("bar-divider")) {
        const dg = ctx.createLinearGradient(x, 0, x + r.width, 0);
        dg.addColorStop(0, "rgba(110,82,51,0)"); dg.addColorStop(.5, "#8a6a3f"); dg.addColorStop(1, "rgba(110,82,51,0)");
        ctx.fillStyle = dg;
        ctx.fillRect(x, y, r.width, r.height);
      } else {
        ctx.fillStyle = "rgba(18,42,44,.6)";
        roundRect(ctx, x, y, r.width, r.height, 8); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(110,82,51,.95)";
        roundRect(ctx, x + 1.5, y + 1.5, r.width - 3, r.height - 3, 7); ctx.stroke();
        const img = el.querySelector("img");
        if (img && img.complete && img.naturalWidth > 0) {
          try { ctx.drawImage(img, x + 2, y + 2, r.width - 4, r.height - 4); } catch (e) {}
        }
      }
    }
    try {
      const blob = await new Promise(function(res, rej) {
        try { canvas.toBlob(function(b) { b ? res(b) : rej(new Error("empty")); }, "image/png"); }
        catch (err) { rej(err); }
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "logos-leiste.png";
      a.click();
      URL.revokeObjectURL(a.href);
      showToast(t("pngOk"));
    } catch (e) {
      if (!isRetry) {
        const ok = await connectFolderForExport();
        if (ok) { await exportPng(true); return; }
      }
      showToast(t("pngFail"));
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function applyLanguage() {
    document.getElementById("subtitle").textContent = t("subtitle");
    document.getElementById("panelTitle").textContent = t("panelTitle");
    document.getElementById("selTitle").textContent = t("selTitle");
    document.getElementById("footerNote").textContent = t("footer");
    document.getElementById("btnExportPng").textContent = t("btnExpPng");
    document.getElementById("btnLang").textContent = t("langBtn");
    btnReset.title = t("clear");
	const lt = document.getElementById("logoTitle");
    if (lt) lt.textContent = LANG === "de" ? "LOGOGRAMME" : "LOGOGRAMS";
    renderLogoList();
    refreshAll();
  }

  document.getElementById("btnLang").addEventListener("click", function() {
    LANG = LANG === "de" ? "en" : "de";
    try { localStorage.setItem(STORE_KEY + ".lang", LANG); } catch (e) {}
    applyLanguage();
  });
  document.getElementById("btnExportPng").addEventListener("click", function() { exportPng(false); });

  btnPlus.addEventListener("click", function() {
    if (rowCount < MAX_ROWS) { rowCount++; rows.push([]); if (rows2) rows2.push([]); refreshAll(); warn.textContent = ""; }
  });
  btnMinus.addEventListener("click", function() {
    if (rowCount > MIN_ROWS) { rowCount--; rows.pop(); if (rows2) rows2.pop(); refreshAll(); }
  });
  btnReset.addEventListener("click", function() {
    if (!confirm(t("resetConfirm"))) return;
    rows = rows.map(function() { return []; });
    if (rows2) rows2 = rows2.map(function() { return []; });
    refreshAll();
  });
  document.getElementById("btnBar2").addEventListener("click", function() {
    if (rows2) rows2 = null;
    else rows2 = rows.map(function() { return []; });
    refreshAll();
  });
  document.addEventListener("click", function(e) {
    const pop = document.getElementById("comboPop");
    if (pop.classList.contains("show") && !pop.contains(e.target) && !e.target.closest(".pct-badge, .pct-cell")) closeComboPop();
  });
  document.getElementById("btnSplitters").addEventListener("click", function() {
  splitterPanelVisible = !splitterPanelVisible;
  renderSplitterPanel();
  });

  try {
    const savedLang = localStorage.getItem(STORE_KEY + ".lang");
    if (savedLang === "de" || savedLang === "en") LANG = savedLang;
  } catch (e) {}

  computeRowHeight();
  applyLanguage();
  loadState();
  window.addEventListener("load", function() { computeRowHeight(); refreshAll(); syncPanels(); });
  window.addEventListener("resize", syncPanels);
  
  (async function initFolder() {
    try {
      const h = await idbGet("projectDir");
      if (h && window.showDirectoryPicker) {
        dirHandle = h;
        if ((await dirHandle.queryPermission({ mode: "read" })) === "granted") {
          await scanIcons();
          refreshImages();
        }
      }
    } catch (e) {}
  })();
</script>
</body>
