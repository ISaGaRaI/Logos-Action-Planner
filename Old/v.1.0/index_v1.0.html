<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eureka Logos Planner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #1a1a1a; color: #e8e8e8;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .toolbar button {
    background: #2a2a2a; color: #ddd; border: 1px solid #444;
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px;
  }
  .toolbar button:hover { background: #3a3a3a; }
  .toolbar button.primary { background: #2c5f63; border-color: #3d8484; }
  .toolbar button.primary:hover { background: #357070; }
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: nowrap; }

  .skill-panel { background-color: #272627; border: 1px solid #141414; border-radius: 10px; padding: 10px; }
  .skill-panel h2 { font-size: 14px; color: #bbb; margin: 2px 2px 10px 2px; font-weight: 600; }
  .skill-grid { display: grid; grid-template-columns: repeat(10, 48px); grid-auto-rows: 48px; gap: 6px; }
  .skill {
    background: #1d1d1d; border: 1px solid #3a3a3a; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative;
    transition: border-color .15s, transform .1s; padding: 2px;
  }
  .skill:hover { border-color: #7fd4d4; transform: translateY(-2px); }
  .skill img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .skill .fallback {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
    font-size: 13px; font-weight: 700; border-radius: 5px; color: #fff; pointer-events: none;
  }
  .skill.has-img .fallback { display: none; }
  .skill.used { border-color: #7fa86a; }
  .skill.used::after {
    content: attr(data-count); position: absolute; top: -6px; right: -6px;
    background: #4a6b35; color: #eaf5df; font-size: 10px; font-weight: 700;
    min-width: 15px; height: 15px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
    border: 1px solid #6b8f52;
  }
  .empty-slot { background: transparent; border: 1px dashed #333; border-radius: 6px; }

  .bar-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar-wrapper { display: flex; flex-direction: row; align-items: flex-start; gap: 10px; }
  .bar-controls-vertical { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bar-controls-vertical button {
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
    width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s;
  }
  .bar-controls-vertical button:hover { background: #454545; border-color: #7fd4d4; }
  .bar-controls-vertical button:disabled { opacity: .3; cursor: default; background: #262626; border-color: #3a3a3a; }
  .bar-controls-vertical button.clear-btn { background: #432c2c; border-color: #7a4a4a; color: #f0d9d9; }
  .bar-controls-vertical button.clear-btn:hover { background: #5a3838; }
  .slot-count { font-size: 11px; color: #888; text-align: center; letter-spacing: .3px; }

  .logos-bar {
    width: 216px; padding: 3px;
    background: linear-gradient(180deg, #3d8484 0%, #2c5f63 60%, #27555a 100%);
    border: 5px solid #6e5233; outline: 1px solid #3f2f1d; border-radius: 10px;
    box-shadow: 0 0 0 3px rgba(110,82,51,.35), inset 0 0 18px rgba(0,0,0,.35);
    display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
    transition: height .25s ease;
  }
  .bar-row { display: flex; flex-direction: row; justify-content: center; gap: 12px; align-items: center; border-radius: 6px; }
  .bar-row.drop-hover { outline: 1px dashed #b8e4e4; outline-offset: -2px; background: rgba(255,255,255,.05); }
  .bar-divider {
    height: 3px; border-radius: 2px; flex-shrink: 0;
    background: linear-gradient(90deg, rgba(110,82,51,0) 0%, #6e5233 12%, #8a6a3f 50%, #6e5233 88%, rgba(110,82,51,0) 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .bar-skill {
    background: rgba(18, 42, 44, .6); border: 2px solid rgba(110, 82, 51, .95); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 1px;
    position: relative; transition: transform .12s;
  }
  .bar-skill:hover { transform: scale(1.06); }
  .bar-skill img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .bar-skill .fallback {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
    font-size: 12px; font-weight: 700; color: #fff; border-radius: 5px; pointer-events: none;
  }
  .bar-skill .remove-hint {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #ffe9a8; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .bar-skill:hover .remove-hint { opacity: 1; }
  .bar-empty { color: #bfe3e3; font-size: 11px; text-align: center; align-self: center; max-width: 140px; line-height: 1.4; user-select: none; }
  .bar-full-warning { color: #ff9b9b; font-size: 12px; min-height: 16px; text-align: center; }

  .selected-panel {
    margin-top: 26px; width: 100%; max-width: 940px;
    background-color: #272627; border: 1px solid #141414; border-radius: 10px; padding: 14px 16px;
  }
  .selected-panel h2 { font-size: 15px; color: #bbb; margin-bottom: 10px; font-weight: 600; }
  .selected-list { display: flex; flex-direction: column; gap: 6px; }
  .sel-item { background: #1d1d1d; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .sel-item summary {
    cursor: pointer; padding: 8px 12px; font-size: 14px;
    display: flex; align-items: center; gap: 10px; list-style: none; user-select: none;
  }
  .sel-item summary::-webkit-details-marker { display: none; }
  .sel-item summary::before { content: "\25B8"; color: #7fd4d4; transition: transform .15s; }
  .sel-item[open] summary::before { transform: rotate(90deg); }
  .sel-item summary:hover { background: #232323; }
  .sel-item .icon-preview { width: 26px; height: 26px; object-fit: contain; border-radius: 4px; background: #151515; padding: 1px; }
  .sel-count { background: #4a6b35; color: #eaf5df; border: 1px solid #6b8f52; font-size: 10.5px; font-weight: 700; border-radius: 8px; padding: 1px 7px; margin-left: 2px; flex-shrink: 0; }
  .sel-count.one { visibility: hidden; }
  .sel-body { padding: 4px 14px 12px 34px; color: #ccc; font-size: 13px; line-height: 1.7; }
  .sel-body .section-label { display: block; font-weight: 700; font-size: 11.5px; letter-spacing: 1px; margin: 8px 0 2px 0; }
  .sel-body .lbl-desc { color: #7fd4d4; }
  .sel-body .lbl-role { color: #e0b060; }
  .sel-body .lbl-combo { color: #a8c86a; }
  .sel-body .skill-desc { color: #ddd; font-size: 13px; line-height: 1.65; border-left: 3px solid #3d8484; padding-left: 10px; }
  .sel-body .role-groups { display: flex; flex-direction: row; flex-wrap: wrap; gap: 14px; border-left: 3px solid #8a6a3f; padding-left: 10px; margin-top: 2px; }
  .role-group { display: flex; flex-direction: column; gap: 3px; min-width: 100px; }
  .role-group-header {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; letter-spacing: .8px; color: #c9a55f;
    border-bottom: 1px solid #4a3a22; padding-bottom: 2px; margin-bottom: 2px; text-transform: uppercase;
  }
  .sel-body .recipe-line { display: list-item; list-style: disc; margin-left: 16px; }
  .sel-body .combo-num { color: #a8c86a; margin-right: 4px; }
  .sel-body .no-data { color: #777; font-style: italic; }
  .selected-empty { color: #777; font-size: 13px; font-style: italic; }
  .footer-note { margin-top: 22px; color: #777; font-size: 12px; text-align: center; max-width: 820px; line-height: 1.5; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #2c5f63; color: #dff5f5; border: 1px solid #3d8484;
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  #tooltip {
    position: fixed; z-index: 999; background: #10201f; color: #e8f4f4;
    border: 1px solid #3d8484; border-radius: 8px; padding: 8px 12px;
    font-size: 12.5px; line-height: 1.55; max-width: 500px;
    pointer-events: none; opacity: 0; transition: opacity .1s; box-shadow: 0 4px 14px rgba(0,0,0,.55);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tip-main { display: flex; flex-direction: row; gap: 10px; align-items: flex-start; }
  #tooltip .tip-text { flex: 1; min-width: 0; }
  #tooltip .tip-text b { display: block; color: #bfe3e3; margin-bottom: 3px; font-size: 13px; }
  #tooltip .tip-nodesc { display: block; color: #6e8a8a; font-style: italic; font-size: 11.5px; }
  #tooltip .tip-desc { display: block; max-width: 500px; }
  #tooltip .tip-sep { display: block; height: 1px; background: #2a4a48; margin: 5px 0; }
  #tooltip .tip-roles { display: flex; flex-direction: row; gap: 1px; align-items: flex-start; margin-top: 1px; }
  #tooltip .tip-role-row { display: flex; flex-direction: column; gap: 3px; }
  #tooltip .tip-jobs { display: flex; flex-direction: column; gap: 1px; padding-top: 0; }
  #tooltip .tip-jobs { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
  #tooltip .tip-job {
    display: flex; align-items: center; justify-content: center;
    background: rgba(46,42,32,.5); border-radius: 6px;
    padding: 1px; width: fit-content;
  }
</style>
</head>

<div class="subtitle" id="subtitle"></div>

        <button id="resetBtn" class="clear-btn" title="Leeren / Clear">&times;</button>

<div id="toast"></div>

  // Rolle werden unter "Ohne Rolle" gesammelt.

  let LANG = (navigator.language || "").toLowerCase().startsWith("de") ? "de" : "en";

  // --- Rollen (Oberklassen) parsen ---
  const ROLES = [];
  (function parseRoles() {
    for (const line of ROLE_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 2 || !parts[0]) continue;
      ROLES.push({ file: parts[0], nameEn: parts[1], nameDe: parts[2] || parts[1] });
    }
  })();
  function roleDisplayName(role) { return LANG === "de" ? role.nameDe : role.nameEn; }

  // --- Klassen parsen ---
  const CLASSES = {};
  (function parseClasses() {
    for (const line of CLASS_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 2 || !parts[0]) continue;
      CLASSES[parts[1].toLowerCase()] = { file: parts[0], nameDe: parts[2] || parts[1], role: parts[3] || "" };
    }
  })();
  function classEntry(name) { return CLASSES[name.trim().toLowerCase()] || null; }
  function classDisplay(name) {
    const e = classEntry(name);
    if (LANG === "de") return e ? e.nameDe : name.trim();
    return name.trim();
  }
  function classRoleKey(name) {
    const e = classEntry(name);
    return e && e.role ? e.role.trim().toLowerCase() : "";
  }

  // --- Klassen nach Oberklasse gruppieren (Reihenfolge wie Tabelle 4) ---
  // Rollen-Namen wie "Healer"/"Heiler" werden automatisch zu allen
  // Klassen dieser Rolle expandiert (gem. CLASS_LINES).
  function groupClasses(clsList) {
    const expanded = [];
    for (const cls of clsList) {
      const c = cls.trim().toLowerCase();
      const roleMatch = ROLES.find(function(r) {
        return r.nameEn.toLowerCase() === c || r.nameDe.toLowerCase() === c;
      });
      if (roleMatch) {
        const rk = roleMatch.nameEn.toLowerCase();
        for (const key of Object.keys(CLASSES)) {
          const e = CLASSES[key];
          if (e.role && e.role.trim().toLowerCase() === rk) expanded.push(key);
        }
      } else {
        expanded.push(cls);
      }
    }
    const seen = new Set();
    const uniq = expanded.filter(function(x) {
      const k = x.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    const groups = ROLES.map(r => ({ role: r, jobs: [] }));
    const other = [];
    for (const cls of uniq) {
      const key = classRoleKey(cls);
      const g = groups.find(g => g.role.nameEn.toLowerCase() === key);
      if (g) g.jobs.push(cls); else other.push(cls);
    }
    const out = groups.filter(g => g.jobs.length > 0);
    if (other.length > 0) out.push({ role: null, jobs: other });
    return out;
  }

  const FRAGMENTS = [];
  (function parseFragments() {
    for (const line of FRAGMENT_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 3 || !parts[0] || !parts[1]) continue;
      FRAGMENTS.push({ file: parts[0], nameEn: parts[1], nameDe: parts[2] || parts[1] });
    }
  })();
  function fragmentByName(name) {
    const key = name.trim().toLowerCase();
    return FRAGMENTS.find(f => f.nameEn.toLowerCase() === key) || null;
  }

  const DESCR = {};
  (function parseDescriptions() {
    for (const line of DESCRIPTION_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 3 || !parts[0]) continue;
      DESCR[parts[0].toLowerCase()] = { descDe: parts[1] || "", descEn: parts[2] || "", classes: parts[3] || "" };
    }
  })();
  function descriptionOf(skill) {
    if (!skill) return null;
    return DESCR[(skill.nameEn || "").toLowerCase()] || null;
  }
  function descTextOf(d) { return LANG === "de" ? (d.descDe || "") : (d.descEn || ""); }
  function classesOf(d) {
    return (d.classes || "").split("+").map(function(s) { return s.trim(); }).filter(Boolean);
  }

  function parseCombo(text) {
    return text.split("+").map(part => {
      const p = part.trim();
      if (!p) return null;
      const m = p.match(/^(.*?)\s*[x\u00d7]\s*(\d+)$/i);
      if (m) return { name: m[1].trim(), count: parseInt(m[2], 10) };
      return { name: p, count: 1 };
    }).filter(Boolean);
  }

  const SKILLS = [];
  (function parseData() {
    const seen = new Set();
    for (const line of DATA_LINES) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//") || trimmed.startsWith("#")) continue;
      const parts = trimmed.split("|").map(p => p.trim().replace(/^"|"$/g, ""));
      if (parts.length < 3 || !parts[0]) continue;
      const file = parts[0], nameEn = parts[1], nameDe = parts[2];
      const combos = parts.slice(3);
      if (!nameEn) continue;
      if (seen.has(nameEn)) continue;
      seen.add(nameEn);
      SKILLS.push({
        id: nameEn, file: file, nameEn: nameEn, nameDe: nameDe || nameEn,
        combos: combos.filter(c => c && c.length > 0),
      });
    }
    for (const n of NAMES) {
      if (!seen.has(n)) SKILLS.push({ id: n, file: n + ".png", nameEn: n, nameDe: n, combos: [] });
    }
  })();

  const PER_ROW = 2, MIN_ROWS = 3, MAX_ROWS = 6, GRID_COLS = 10, GRID_ROWS = 6;
  const BAR_V_PAD = 2 * 3, BAR_BORDER = 2 * 5, DIV_H = 3, BAR_GAP = 4;

  function capacity() { return rowCount * PER_ROW; }
  function usedCount() { return rows.reduce(function(n, r) { return n + r.length; }, 0); }
  function skillById(id) { return SKILLS.find(function(s) { return s.id === id; }); }
  function warnOnce(msg) {
    warn.textContent = msg;
    setTimeout(function() { if (warn.textContent === msg) warn.textContent = ""; }, 2500);
  }

  let ROW_H = 44;
  function computeRowHeight() {
    const panelH = panel.offsetHeight;
    const inner = panelH - BAR_V_PAD - BAR_BORDER;
    const overhead = (MAX_ROWS - 1) * DIV_H + (2 * MAX_ROWS - 2) * BAR_GAP;
    ROW_H = Math.max(30, Math.floor((inner - overhead) / MAX_ROWS));
  }
  function barHeightFor(r) {
    const overhead = (r - 1) * DIV_H + (2 * r - 2) * BAR_GAP;
    return BAR_V_PAD + BAR_BORDER + r * ROW_H + overhead;
  }

  function initials(name) {
    return name.split(/\s+/).map(function(w) { return w[0]; }).join("").slice(0, 3).toUpperCase();
  }
  function hueOf(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
    return h;
  }
  function makeFallback(name) {
    const el = document.createElement("span");
    el.className = "fallback";
    el.textContent = initials(name);
    el.style.background = "hsl(" + hueOf(name) + ", 38%, 34%)";
    return el;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
    function fillSentences(el, text) {
    if (!text) return;
    var parts = text.split(". ");
    for (var i = 0; i < parts.length; i++) {
      if (i > 0) el.appendChild(document.createElement("br"));
      var s = parts[i];
      if (i < parts.length - 1) s = s + ".";
      el.appendChild(document.createTextNode(s));
    }
  }

  let dirHandle = null;
  let iconUrls = {};

  function idbOpen() {
    return new Promise(function(res, rej) {
      const rq = indexedDB.open("eurekaLogosPlanner", 1);
      rq.onupgradeneeded = function() { rq.result.createObjectStore("kv"); };
      rq.onsuccess = function() { res(rq.result); };
      rq.onerror = function() { rej(rq.error); };
    });
  }
  async function idbSet(k, v) {
    const db = await idbOpen();
    return new Promise(function(res, rej) {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = res;
      tx.onerror = function() { rej(tx.error); };
    });
  }
  async function idbGet(k) {
    const db = await idbOpen();
    return new Promise(function(res, rej) {
      const tx = db.transaction("kv", "readonly");
      const rq = tx.objectStore("kv").get(k);
      rq.onsuccess = function() { res(rq.result); };
      rq.onerror = function() { rej(rq.error); };
    });
  }
  async function getSubDir(name) {
    try { return await dirHandle.getDirectoryHandle(name, { create: false }); }
    catch (e) { return null; }
  }
  async function scanIcons() {
    iconUrls = {};
    if (!dirHandle) return;
    for (const dirName of [ACTIONS_DIR, FRAGMENTS_DIR, CLASS_ROLE_DIR]) {
      const sub = await getSubDir(dirName);
      if (!sub) continue;
      try {
        for await (const entry of sub.entries()) {
          const name = entry[0], handle = entry[1];
          if (handle.kind === "file") {
            try { iconUrls[name.toLowerCase()] = URL.createObjectURL(await handle.getFile()); }
            catch (e) {}
          }
        }
      } catch (e) {}
    }
  }
  function iconUrlFor(file) {
    return iconUrls[file.toLowerCase()] || (ACTIONS_DIR + "/" + file);
  }
  function refreshImages() {
    document.querySelectorAll("img[data-file]").forEach(function(im) {
      im.src = iconUrls[im.dataset.file];
    });
  }
  function makeImg(skill) {
    const img = document.createElement("img");
    img.dataset.file = skill.file;
    img.src = iconUrlFor(skill.file);
    img.alt = skill.id;
    return img;
  }
  function makeClassImg(file, alt) {
    const img = document.createElement("img");
    img.dataset.file = file;
    img.src = iconUrls[file.toLowerCase()] || (CLASS_ROLE_DIR + "/" + file);
    img.alt = alt;
    img.loading = "lazy";
    img.style.width = CLASS_ICON_PX + "px";
    img.style.height = CLASS_ICON_PX + "px";
    img.style.objectFit = "contain";
    img.onerror = function() { img.remove(); };
    return img;
  }
  function makeJobChip(cls) {
    const chip = document.createElement("span");
    chip.className = "tip-job";
    const e = classEntry(cls);
    if (e && e.file) chip.appendChild(makeClassImg(e.file, cls));
    else chip.textContent = classDisplay(cls);   // Fallback nur falls Icon fehlt
    return chip;
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(function() { toast.classList.remove("show"); }, 3800);
  }

  function updateTileMarkers() {
    const counts = {};
    for (const r of rows) for (const id of r) counts[id] = (counts[id] || 0) + 1;
    grid.querySelectorAll(".skill").forEach(function(tile) {
      const n = counts[tile.dataset.id] || 0;
      if (n > 0) { tile.classList.add("used"); tile.dataset.count = n; }
      else { tile.classList.remove("used"); delete tile.dataset.count; }
    });
  }

  let dragPayload = null;

  function clearDropHighlights() {
    bar.querySelectorAll(".bar-row").forEach(function(r) { r.classList.remove("drop-hover"); });
  }
  function insertionIndex(rowEl, x) {
    const skills = Array.prototype.slice.call(rowEl.querySelectorAll(".bar-skill"));
    for (let i = 0; i < skills.length; i++) {
      const b = skills[i].getBoundingClientRect();
      if (x < b.left + b.width / 2) return i;
    }
    return skills.length;
  }
  function handleDropOnRow(r, e, rowEl) {
    if (!dragPayload) return;
    let idx = Math.min(insertionIndex(rowEl, e.clientX), PER_ROW);
    if (dragPayload.kind === "new") {
      if (rows[r].length >= PER_ROW) { warnOnce(t("rowFull")); dragPayload = null; return; }
      rows[r].splice(idx, 0, dragPayload.id);
    } else {
      const fr = dragPayload.r, fi = dragPayload.i;
      const id = rows[fr][fi];
      if (id === undefined) { dragPayload = null; return; }
      rows[fr].splice(fi, 1);
      if (fr === r && fi < idx) idx--;
      if (rows[r].length >= PER_ROW) {
        rows[fr].splice(fi, 0, id);
        warnOnce(t("rowFull"));
        dragPayload = null;
        refreshAll();
        return;
      }
      rows[r].splice(idx, 0, id);
    }
    dragPayload = null;
    refreshAll();
  }
  document.addEventListener("dragend", function() {
    dragPayload = null;
    clearDropHighlights();
    tipEl.classList.remove("show");
  });

  for (const skill of SKILLS) {
    const tile = document.createElement("div");
    tile.className = "skill";
    tile.dataset.id = skill.id;
    tile.appendChild(makeFallback(skill.id));
    const img = makeImg(skill);
    img.onload = function() { tile.classList.add("has-img"); tile.appendChild(img); };
    tile.addEventListener("click", function() {
      const target = rows.findIndex(function(rw) { return rw.length < PER_ROW; });
      if (target === -1) { warnOnce(t("full")); return; }
      rows[target].push(skill.id);
      refreshAll();
    });
    tile.draggable = true;
    tile.addEventListener("dragstart", function(e) {
      dragPayload = { kind: "new", id: skill.id };
      e.dataTransfer.effectAllowed = "copyMove";
      e.dataTransfer.setData("text/plain", skill.id);
      tipEl.classList.remove("show");
    });
    bindTooltip(tile, function() { return skill; });
    grid.appendChild(tile);
  }
  for (let i = SKILLS.length; i < GRID_COLS * GRID_ROWS; i++) {
    const ph = document.createElement("div");
    ph.className = "empty-slot";
    grid.appendChild(ph);
  }

  grid.addEventListener("dragover", function(e) {
    if (dragPayload && dragPayload.kind === "move") e.preventDefault();
  });
  grid.addEventListener("drop", function(e) {
    e.preventDefault();
    if (dragPayload && dragPayload.kind === "move") {
      const r = dragPayload.r, i = dragPayload.i;
      rows[r].splice(i, 1);
      dragPayload = null;
      refreshAll();
    }
  });

  function removeFromRow(r, i) {
    rows[r].splice(i, 1);
    refreshAll();
  }

  function renderBar() {
    bar.innerHTML = "";
    bar.style.height = barHeightFor(rowCount) + "px";
    const skillSize = Math.max(22, ROW_H - 6);
    for (let r = 0; r < rowCount; r++) {
      const rowEl = document.createElement("div");
      rowEl.className = "bar-row";
      rowEl.style.height = ROW_H + "px";
      rowEl.style.justifyContent = rows[r].length > 1 ? "space-evenly" : "center";
      rows[r].forEach(function(id, i) {
        const skill = skillById(id);
        if (!skill) return;
        const el = document.createElement("div");
        el.className = "bar-skill";
        el.style.width = skillSize + "px";
        el.style.height = skillSize + "px";
        const hint = document.createElement("span");
        hint.className = "remove-hint";
        hint.textContent = "\u2715";
        el.appendChild(hint);
        el.appendChild(makeFallback(skill.id));
        const img = makeImg(skill);
        img.onload = function() { el.innerHTML = ""; el.appendChild(hint); el.appendChild(img); };
        el.addEventListener("click", function() { removeFromRow(r, i); });
        el.draggable = true;
        el.addEventListener("dragstart", function(e) {
          e.stopPropagation();
          dragPayload = { kind: "move", r: r, i: i };
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", id);
          tipEl.classList.remove("show");
        });
        bindTooltip(el, function() { return skill; });
        rowEl.appendChild(el);
      });
      if (rowEl.children.length === 0 && usedCount() === 0 && r === 0) {
        const hint = document.createElement("div");
        hint.className = "bar-empty";
        hint.textContent = t("emptyHint");
        rowEl.appendChild(hint);
      }
      rowEl.addEventListener("dragover", function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = (dragPayload && dragPayload.kind === "move") ? "move" : "copy";
        rowEl.classList.add("drop-hover");
      });
      rowEl.addEventListener("dragleave", function(e) {
        if (!rowEl.contains(e.relatedTarget)) rowEl.classList.remove("drop-hover");
      });
      rowEl.addEventListener("drop", function(e) {
        e.preventDefault();
        rowEl.classList.remove("drop-hover");
        handleDropOnRow(r, e, rowEl);
      });
      bar.appendChild(rowEl);
      if (r < rowCount - 1) {
        const div = document.createElement("div");
        div.className = "bar-divider";
        bar.appendChild(div);
      }
    }
  }

  // --- Rollen-Gruppen (Tooltip + Klapptext) ---
  function makeRoleHeader(g, forTooltip) {
    const head = document.createElement(forTooltip ? "div" : "div");
    head.className = forTooltip ? "tip-role-head" : "role-group-header";
    if (g.role) {
      if (g.role.file) head.appendChild(makeClassImg(g.role.file, g.role.nameEn));
      const rn = document.createElement("span");
      rn.textContent = roleDisplayName(g.role);
      head.appendChild(rn);
    } else {
      const rn = document.createElement("span");
      rn.textContent = t("noRole");
      head.appendChild(rn);
    }
    return head;
  }
  function makeTooltipRoleGroups(clsList) {
    const wrap = document.createElement("div");
    wrap.className = "tip-roles";
    for (const g of groupClasses(clsList)) {
      const row = document.createElement("div");
      row.className = "tip-role-row";
      const jobs = document.createElement("div");
      jobs.className = "tip-jobs";
      g.jobs.forEach(function(cls) { jobs.appendChild(makeJobChip(cls)); });
      row.appendChild(jobs);
      wrap.appendChild(row);
    }
    return wrap;
  }
  function makeBodyRoleGroups(clsList) {
    const wrap = document.createElement("div");
    wrap.className = "role-groups";
    for (const g of groupClasses(clsList)) {
      const grp = document.createElement("div");
      grp.className = "role-group";
      grp.appendChild(makeRoleHeader(g, false));
      const jobs = document.createElement("div");
      jobs.className = "tip-jobs";
      g.jobs.forEach(function(cls) { jobs.appendChild(makeJobChip(cls)); });
      grp.appendChild(jobs);
      wrap.appendChild(grp);
    }
    return wrap;
  }

  // Hover-Tooltip: Name + Beschreibung + Rollen-Gruppen
  function fillTip(skill) {
    if (!skill) { tipEl.classList.remove("show"); return; }
    tipEl.innerHTML = "";
    const main = document.createElement("div");
    main.className = "tip-main";
    const textCol = document.createElement("div");
    textCol.className = "tip-text";
    const b = document.createElement("b");
    b.textContent = displayName(skill);
    textCol.appendChild(b);
    const d = descriptionOf(skill);
    const txt = d ? descTextOf(d) : "";
    const ds = document.createElement("span");
    ds.className = txt ? "tip-desc" : "tip-nodesc";
    if (txt) fillSentences(ds, txt);
    else ds.textContent = t("noDesc");
    textCol.appendChild(ds);
    main.appendChild(textCol);
    const clsList = d ? classesOf(d) : [];
    if (clsList.length > 0) main.appendChild(makeTooltipRoleGroups(clsList));
    tipEl.appendChild(main);
    tipEl.classList.add("show");
  }
  function moveTip(e) {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tipEl.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = Math.max(8, e.clientX - r.width - pad);
    if (y + r.height > window.innerHeight - 8) y = Math.max(8, e.clientY - r.height - pad);
    tipEl.style.left = x + "px";
    tipEl.style.top = y + "px";
  }
  function bindTooltip(el, getSkill) {
    el.addEventListener("mouseenter", function(e) { fillTip(getSkill()); moveTip(e); });
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", function() { tipEl.classList.remove("show"); });
  }

  // Klapptext: BESCHREIBUNG -> KLASSEN (gruppiert) -> KOMBINATIONEN
  function renderSelectedList() {
    const list = document.getElementById("selectedList");
    list.innerHTML = "";
    const flat = [];
    for (const r of rows) for (const id of r) flat.push(id);
    if (flat.length === 0) {
      const p = document.createElement("div");
      p.className = "selected-empty";
      p.textContent = t("selEmpty");
      list.appendChild(p);
      return;
    }
    const counts = new Map();
    for (const id of flat) counts.set(id, (counts.get(id) || 0) + 1);
    for (const [id, count] of counts) {
      const skill = skillById(id);
      if (!skill) continue;
      const det = document.createElement("details");
      det.className = "sel-item";
      const sum = document.createElement("summary");
      const icon = makeImg(skill);
      icon.className = "icon-preview";
      sum.appendChild(icon);
      const txt = document.createElement("span");
      txt.textContent = displayName(skill);
      sum.appendChild(txt);

      const badge = document.createElement("span");
      badge.className = "sel-count" + (count > 1 ? "" : " one");
      badge.textContent = t("times")(count);
      sum.appendChild(badge);

      det.appendChild(sum);
      const body = document.createElement("div");
      body.className = "sel-body";

      const d = descriptionOf(skill);
      const dtxt = d ? descTextOf(d) : "";
      if (dtxt) {
        const dl = document.createElement("span");
        dl.className = "section-label lbl-desc";
        dl.textContent = t("lblDesc");
        body.appendChild(dl);
        const dp = document.createElement("div");
        dp.className = "skill-desc";
             fillSentences(dp, dtxt);
        body.appendChild(dp);
      }

      const clsList = d ? classesOf(d) : [];
      if (clsList.length > 0) {
        const rl = document.createElement("span");
        rl.className = "section-label lbl-role";
        rl.textContent = t("lblRole");
        body.appendChild(rl);
        body.appendChild(makeBodyRoleGroups(clsList));
      }

      if (skill.combos.length > 0) {
        const cl = document.createElement("span");
        cl.className = "section-label lbl-combo";
        cl.textContent = t("lblCombo");
        body.appendChild(cl);
        skill.combos.forEach(function(comboText, i) {
          const li = document.createElement("div");
          li.className = "recipe-line";
          const num = document.createElement("span");
          num.className = "combo-num";
          num.textContent = t("combo")(i + 1) + " ";
          li.appendChild(num);
          const pieces = parseCombo(comboText);
          pieces.forEach(function(piece, pi) {
            if (pi > 0) li.appendChild(document.createTextNode("  +  "));
            const frag = fragmentByName(piece.name);
            if (frag) {
              const fi = document.createElement("img");
              fi.dataset.file = frag.file;
              fi.src = iconUrls[frag.file.toLowerCase()] || (FRAGMENTS_DIR + "/" + frag.file);
              fi.alt = frag.nameEn;
              fi.style.cssText = "width:18px;height:18px;vertical-align:-3px;margin-right:3px;object-fit:contain;";
              li.appendChild(fi);
              const nm = document.createElement("span");
              nm.textContent = LANG === "de" ? frag.nameDe : frag.nameEn;
              li.appendChild(nm);
            } else {
              const nm = document.createElement("span");
              nm.textContent = piece.name;
              li.appendChild(nm);
            }
            if (piece.count > 1) {
              const cnt = document.createElement("span");
              cnt.textContent = " " + t("times")(piece.count);
              li.appendChild(cnt);
            }
          });
          body.appendChild(li);
        });
      } else {
        const nd = document.createElement("div");
        nd.className = "no-data";
        nd.textContent = t("noData");
        body.appendChild(nd);
      }
      det.appendChild(body);
      list.appendChild(det);
    }
  }

  function refreshAll() {
    renderBar();
    renderSelectedList();
    updateTileMarkers();
    updateSlotLabel();
    saveState();
  }
  function updateSlotLabel() {
    label.textContent = t("rows")(rowCount, capacity());
    btnMinus.disabled = (rowCount <= MIN_ROWS);
    btnPlus.disabled = (rowCount >= MAX_ROWS);
  }

  function stateObj() {
    return { app: "eureka-logos-planner", rows: rows.map(function(r) { return r.slice(); }) };
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stateObj())); } catch (e) {}
  }
  function chunkPairs(arr, n) {
    const out = [];
    let i = 0;
    while (out.length < n) { out.push(arr.slice(i, i + PER_ROW)); i += PER_ROW; }
    return out;
  }
  function applyState(st) {
    let newRows = null;
    if (st && Array.isArray(st.rows)) newRows = st.rows;
    else if (st && Array.isArray(st.skills)) newRows = chunkPairs(st.skills, st.rows || 3);
    if (!newRows) return false;
    rowCount = Math.max(MIN_ROWS, Math.min(MAX_ROWS, newRows.length || MIN_ROWS));
    rows = [];
    for (let r = 0; r < rowCount; r++) {
      const src = newRows[r] || [];
      rows.push(src.filter(function(id) { return !!skillById(id); }).slice(0, PER_ROW));
    }
    computeRowHeight();
    refreshAll();
    return true;
  }
  function loadState() {
    try {
      let raw = localStorage.getItem(STORE_KEY);
      if (!raw) raw = localStorage.getItem(OLD_STORE_KEY);
      if (!raw) return;
      applyState(JSON.parse(raw));
    } catch (e) {}
  }

  function waitForImages() {
    const imgs = Array.prototype.slice.call(document.querySelectorAll("img[data-file]"));
    return Promise.all(imgs.map(function(im) {
      return im.complete ? Promise.resolve() : new Promise(function(res) { im.onload = res; im.onerror = res; });
    }));
  }
  async function connectFolderForExport() {
    if (!window.showDirectoryPicker) return false;
    try {
      if (dirHandle && (await dirHandle.queryPermission({ mode: "read" })) === "granted") return true;
      showToast(t("pngAskFolder"));
      dirHandle = await window.showDirectoryPicker({ mode: "read" });
      try { await idbSet("projectDir", dirHandle); } catch (e) {}
      await scanIcons();
      refreshImages();
      await waitForImages();
      return true;
    } catch (e) { return false; }
  }
  async function exportPng(isRetry) {
    if (isRetry === undefined) isRetry = false;
    const SCALE = 2;
    const bw = bar.offsetWidth, bh = bar.offsetHeight;
    const canvas = document.createElement("canvas");
    canvas.width = bw * SCALE; canvas.height = bh * SCALE;
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    const grad = ctx.createLinearGradient(0, 0, 0, bh);
    grad.addColorStop(0, "#3d8484"); grad.addColorStop(0.6, "#2c5f63"); grad.addColorStop(1, "#27555a");
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, bw, bh, 10); ctx.fill();
    ctx.lineWidth = 5; ctx.strokeStyle = "#6e5233";
    roundRect(ctx, 2.5, 2.5, bw - 5, bh - 5, 8); ctx.stroke();
    const barRect = bar.getBoundingClientRect();
    for (const el of bar.querySelectorAll(".bar-skill, .bar-divider")) {
      const r = el.getBoundingClientRect();
      const x = r.left - barRect.left, y = r.top - barRect.top;
      if (el.classList.contains("bar-divider")) {
        const dg = ctx.createLinearGradient(x, 0, x + r.width, 0);
        dg.addColorStop(0, "rgba(110,82,51,0)"); dg.addColorStop(.5, "#8a6a3f"); dg.addColorStop(1, "rgba(110,82,51,0)");
        ctx.fillStyle = dg;
        ctx.fillRect(x, y, r.width, r.height);
      } else {
        ctx.fillStyle = "rgba(18,42,44,.6)";
        roundRect(ctx, x, y, r.width, r.height, 8); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(110,82,51,.95)";
        roundRect(ctx, x + 1.5, y + 1.5, r.width - 3, r.height - 3, 7); ctx.stroke();
        const img = el.querySelector("img");
        if (img && img.complete && img.naturalWidth > 0) {
          try { ctx.drawImage(img, x + 2, y + 2, r.width - 4, r.height - 4); } catch (e) {}
        }
      }
    }
    try {
      const blob = await new Promise(function(res, rej) {
        try { canvas.toBlob(function(b) { b ? res(b) : rej(new Error("empty")); }, "image/png"); }
        catch (err) { rej(err); }
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "logos-leiste.png";
      a.click();
      URL.revokeObjectURL(a.href);
      showToast(t("pngOk"));
    } catch (e) {
      if (!isRetry) {
        const ok = await connectFolderForExport();
        if (ok) { await exportPng(true); return; }
      }
      showToast(t("pngFail"));
    }
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function applyLanguage() {
    document.getElementById("subtitle").textContent = t("subtitle");
    document.getElementById("panelTitle").textContent = t("panelTitle");
    document.getElementById("selTitle").textContent = t("selTitle");
    document.getElementById("footerNote").textContent = t("footer");
    document.getElementById("btnExportPng").textContent = t("btnExpPng");
    document.getElementById("btnLang").textContent = t("langBtn");
    btnReset.title = t("clear");
    refreshAll();
  }

  document.getElementById("btnLang").addEventListener("click", function() {
    LANG = LANG === "de" ? "en" : "de";
    try { localStorage.setItem(STORE_KEY + ".lang", LANG); } catch (e) {}
    applyLanguage();
  });
  document.getElementById("btnExportPng").addEventListener("click", function() { exportPng(false); });

  btnPlus.addEventListener("click", function() {
    if (rowCount < MAX_ROWS) { rowCount++; rows.push([]); refreshAll(); warn.textContent = ""; }
  });
  btnMinus.addEventListener("click", function() {
    if (rowCount > MIN_ROWS) { rowCount--; rows.pop(); refreshAll(); }
  });
  btnReset.addEventListener("click", function() {
    if (!confirm(t("resetConfirm"))) return;
    rows = rows.map(function() { return []; });
    refreshAll();
  });

  try {
    const savedLang = localStorage.getItem(STORE_KEY + ".lang");
    if (savedLang === "de" || savedLang === "en") LANG = savedLang;
  } catch (e) {}

  computeRowHeight();
  applyLanguage();
  loadState();
  window.addEventListener("load", function() { computeRowHeight(); refreshAll(); });

  (async function initFolder() {
    try {
      const h = await idbGet("projectDir");
      if (h && window.showDirectoryPicker) {
        dirHandle = h;
        if ((await dirHandle.queryPermission({ mode: "read" })) === "granted") {
          await scanIcons();
          refreshImages();
        }
      }
    } catch (e) {}
  })();
</script>
</body>
